<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Esqueci minha senha • Desafiei</title>
    <link rel="icon" href="{{ url_for('static', filename='img/coruja.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container" style="max-width:480px;margin-top:60px">

        <div class="card fade-in" style="text-align:center;padding:36px 24px">
            <div style="font-size:72px;line-height:1;margin-bottom:8px">🔐</div>
            <h1 style="background:var(--grad-hero);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px">
                Esqueci minha senha
            </h1>
            <p style="color:var(--texto-sec);font-weight:500">
                Digite seu email cadastrado e enviaremos um link para você criar uma nova senha.
            </p>
        </div>

        <div class="card fade-in">
            <form onsubmit="pedirRecuperacao(event)">
                <label>Email cadastrado</label>
                <input type="email" name="email" placeholder="voce@email.com" required autofocus>

                <button class="btn" type="submit" style="width:100%;margin-top:8px">
                    📧 Enviar link de recuperação
                </button>
            </form>

            <p style="margin-top:18px;text-align:center;color:var(--texto-sec);font-size:14px">
                Lembrou a senha?
                <a href="/" style="font-weight:700">Voltar para o login</a>
            </p>
        </div>
    </div>

    <!-- Coruja -->
    <div class="coruja-guia" id="coruja-guia">🦉</div>
    <div class="coruja-balao" id="coruja-balao"></div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/tema.js') }}"></script>

    <script>
        async function pedirRecuperacao(event) {
            event.preventDefault();
            const form = event.target;
            const dados = new FormData(form);
            const email = dados.get("email");

            // Desabilita o botão para evitar cliques duplos
            const botao = form.querySelector("button");
            botao.disabled = true;
            botao.textContent = "Enviando...";

            try {
                const resp = await fetch("/api/esqueci-senha", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email })
                });
                const json = await resp.json();

                if (json.ok) {
                    // 🎉 Tela de sucesso
                    mostrarSucessoEmail(email);
                } else {
                    alert("⚠️ " + (json.erro || "Erro ao enviar email"));
                    botao.disabled = false;
                    botao.textContent = "📧 Enviar link de recuperação";
                }
            } catch (e) {
                alert("⚠️ Erro de conexão. Tente novamente.");
                botao.disabled = false;
                botao.textContent = "📧 Enviar link de recuperação";
            }
        }

        function mostrarSucessoEmail(email) {
            document.body.innerHTML = `
                <div class="container" style="max-width:520px;margin-top:80px">
                    <div class="card fade-in" style="text-align:center;padding:44px 28px;animation: final-entra 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)">
                        <div style="font-size:80px;line-height:1;margin-bottom:12px;animation: festa-gira 2s infinite">📧</div>
                        <h1 style="background:var(--grad-hero);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">
                            Email enviado!
                        </h1>
                        <p style="color:var(--texto-sec);font-size:16px;line-height:1.6;margin:16px 0 24px">
                            Enviamos um link de recuperação para:<br>
                            <strong style="color:var(--primaria)">${email}</strong>
                        </p>
                        <div class="alerta" style="text-align:left;font-size:14px">
                            📬 <strong>Verifique sua caixa de entrada</strong><br><br>
                            Se não encontrar, verifique a pasta de <strong>spam</strong> ou <strong>lixo eletrônico</strong>.
                            O link é válido por <strong>30 minutos</strong>.
                        </div>
                        <div style="margin-top:24px">
                            <a href="/" class="btn">🏠 Voltar para o login</a>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
